name: Daily PT Check-in

on:
  schedule:
    - cron: '38 7,19 * * *'   # 北京时间 3:38/15:38
  workflow_dispatch:     # 允许手动触发

jobs:
  check-in:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'cloakbrowser[geoip]'  # 包含 geoip 支持，用于代理时区匹配
          pip install requests

      # 关键：缓存浏览器内核（约200MB），避免每次都下载
      - name: Cache CloakBrowser kernel
        uses: actions/cache@v4
        id: cloak-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-cloak-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-cloak-

      # 仅在缓存未命中时下载内核
      - name: Install CloakBrowser kernel
        if: steps.cloak-cache.outputs.cache-hit != 'true'
        run: |
          python -c "import cloakbrowser; cloakbrowser.install()" 2>/dev/null || \
          playwright install

      # 生成 config.json
      - name: Generate config.json
        env:
          OURBITS_USERNAME: ${{ secrets.OURBITS_USERNAME }}
          OURBITS_PASSWORD: ${{ secrets.OURBITS_PASSWORD }}
          HDKYL_USERNAME: ${{ secrets.HDKYL_USERNAME }}
          HDKYL_PASSWORD: ${{ secrets.HDKYL_PASSWORD }}
          HITPT_USERNAME: ${{ secrets.HITPT_USERNAME }}
          HITPT_PASSWORD: ${{ secrets.HITPT_PASSWORD }}
          PIGGO_USERNAME: ${{ secrets.PIGGO_USERNAME }}
          PIGGO_PASSWORD: ${{ secrets.PIGGO_PASSWORD }}
          AUDIENCES_USERNAME: ${{ secrets.AUDIENCES_USERNAME }}
          AUDIENCES_PASSWORD: ${{ secrets.AUDIENCES_PASSWORD }}
        run: |
          python -c "
          import json
          sites = []
          
          if '$OURBITS_USERNAME' and '$OURBITS_PASSWORD':
              sites.append({
                  'name': 'ourbits',
                  'username': '$OURBITS_USERNAME',
                  'password': '$OURBITS_PASSWORD',
                  'enabled': True
              })
          
          if '$HDKYL_USERNAME' and '$HDKYL_PASSWORD':
              sites.append({
                  'name': 'hdkyl',
                  'username': '$HDKYL_USERNAME',
                  'password': '$HDKYL_PASSWORD',
                  'enabled': True
              })
          
          if '$HITPT_USERNAME' and '$HITPT_PASSWORD':
              sites.append({
                  'name': 'hitpt',
                  'username': '$HITPT_USERNAME',
                  'password': '$HITPT_PASSWORD',
                  'enabled': True
              })
              
          if '$PIGGO_USERNAME' and '$PIGGO_PASSWORD':
              sites.append({
                  'name': 'piggo',
                  'username': '$PIGGO_USERNAME',
                  'password': '$PIGGO_PASSWORD',
                  'enabled': True
              })
          
          if '$AUDIENCES_USERNAME' and '$AUDIENCES_PASSWORD':
              sites.append({
                  'name': 'audiences',
                  'username': '$AUDIENCES_USERNAME',
                  'password': '$AUDIENCES_PASSWORD',
                  'enabled': True
              })
          
          config = {'sites': sites}
          with open('config.json', 'w', encoding='utf-8') as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
          
          import re
          debug_json = json.dumps(config, indent=2, ensure_ascii=False)
          debug_json = re.sub(r'\"password\":\s*\"[^\"]*\"', '\"password\": \"***\"', debug_json)
          print(debug_json)
          "

      # 从 Secret 生成各站点的 cookies
      - name: Generate cookies_audiences.json from Secret
        env:
          COOKIE_STRING: ${{ secrets.AUDIENCES_COOKIE }}
        run: |
          if [ -n "$COOKIE_STRING" ]; then
            echo "从 Secret 生成 cookies_audiences.json"
            python -c "
          import json
          cookie_string = '$COOKIE_STRING'
          cookies = []
          for item in cookie_string.split(';'):
              if '=' in item:
                  name, value = item.strip().split('=', 1)
                  cookies.append({
                      'name': name,
                      'value': value,
                      'domain': '.audiences.me',
                      'path': '/'
                  })
          with open('cookies_audiences.json', 'w') as f:
              json.dump(cookies, f, indent=2)
          print('✅ cookies_audiences.json 已生成')
          "
          else
            echo "⚠️ 未找到 AUDIENCES_COOKIE Secret，跳过"
          fi

      - name: Generate cookies_hdkyl.json from Secret
        env:
          COOKIE_STRING: ${{ secrets.HDKYL_COOKIE }}
        run: |
          if [ -n "$COOKIE_STRING" ]; then
            echo "从 Secret 生成 cookies_hdkyl.json"
            python -c "
          import json
          cookie_string = '$COOKIE_STRING'
          cookies = []
          for item in cookie_string.split(';'):
              if '=' in item:
                  name, value = item.strip().split('=', 1)
                  cookies.append({
                      'name': name,
                      'value': value,
                      'domain': '.hdkyl.in',
                      'path': '/'
                  })
          with open('cookies_hdkyl.json', 'w') as f:
              json.dump(cookies, f, indent=2)
          print(' cookies_hdkyl.json 已生成')
          "
          else
            echo " 未找到 HDKYL_COOKIE Secret，跳过"
          fi

      - name: Generate cookies_hitpt.json from Secret
        env:
          COOKIE_STRING: ${{ secrets.HITPT_COOKIE }}
        run: |
          if [ -n "$COOKIE_STRING" ]; then
            echo "从 Secret 生成 cookies_hitpt.json"
            python -c "
          import json
          cookie_string = '$COOKIE_STRING'
          cookies = []
          for item in cookie_string.split(';'):
              if '=' in item:
                  name, value = item.strip().split('=', 1)
                  cookies.append({
                      'name': name,
                      'value': value,
                      'domain': '.hitpt.com',
                      'path': '/'
                  })
          with open('cookies_hitpt.json', 'w') as f:
              json.dump(cookies, f, indent=2)
          print(' cookies_hitpt.json 已生成')
          "
          else
            echo " 未找到 HITPT_COOKIE Secret，跳过"
          fi

      - name: Generate cookies_piggo.json from Secret
        env:
          COOKIE_STRING: ${{ secrets.PIGGO_COOKIE }}
        run: |
          if [ -n "$COOKIE_STRING" ]; then
            echo "从 Secret 生成 cookies_piggo.json"
            python -c "
          import json
          cookie_string = '$COOKIE_STRING'
          cookies = []
          for item in cookie_string.split(';'):
              if '=' in item:
                  name, value = item.strip().split('=', 1)
                  cookies.append({
                      'name': name,
                      'value': value,
                      'domain': '.piggo.me',
                      'path': '/'
                  })
          with open('cookies_piggo.json', 'w') as f:
              json.dump(cookies, f, indent=2)
          print(' cookies_piggo.json 已生成')
          "
          else
            echo " 未找到 PIGGO_COOKIE Secret，跳过"
          fi       

      # 执行签到（使用 xvfb-run 启用虚拟显示，运行有头模式）
      - name: Run check-in
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          AI_KEY: ${{ secrets.AI_KEY }}
          CAPTCHA_API_URL: ${{ secrets.CAPTCHA_API_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          xvfb-run python checkin.py
