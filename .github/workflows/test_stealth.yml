name: Test Stealth Audiences Check-in

on:
  workflow_dispatch:

jobs:
  test-stealth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements_stealth.txt
          playwright install chromium

      - name: Run audiences check-in test
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          AUDIENCES_COOKIE: ${{ secrets.AUDIENCES_COOKIE }}
        run: |
          xvfb-run python checkin_audiences_stealth.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stealth-debug
          path: |
            audiences_*.html
            audiences_*.png
          retention-days: 7
